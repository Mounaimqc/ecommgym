<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronPulse | Premium Sports Nutrition</title>
  <link rel="icon" href="logo.png" type="image/x-icon">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========== BLACK & GOLD THEME ========== */
    :root {
      --primary: #ffcc00;
      --primary-dark: #D4AF37;
      --bg: #050505;
      --surface: #111111;
      --text: #fff;
      --text-light: #888;
      --border: #333;
      --radius: 12px;
      --radius-lg: 20px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, .5);
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      color: var(--text);
    }

    a { text-decoration: none; color: inherit; transition: var(--transition); }
    button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; outline: none; transition: var(--transition); }

    /* ========== HEADER ========== */
    .header {
      background: rgba(5, 5, 5, 0.98);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .header-container {
      max-width: 1400px; margin: 0 auto; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .logo { display: flex; align-items: center; gap: 12px; font-family: 'Montserrat', sans-serif; }
    .logo img { height: 50px; width: auto; border-radius: var(--radius); border: 2px solid var(--primary); }
    .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-name { font-size: 1.4rem; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 2px; }
    .brand-tagline { font-size: 0.85rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 3px; }

    .header-actions { display: flex; align-items: center; gap: 12px; }
    .header-btn {
      display: flex; align-items: center; gap: 8px; padding: 10px 18px;
      border-radius: var(--radius); background: transparent; color: var(--text);
      font-weight: 600; font-size: 0.9rem; border: 1px solid var(--primary);
    }
    .header-btn:hover { background: var(--primary); color: #000; }
    
    .cart-btn { 
      position: relative; 
      background: var(--primary); 
      color: #000; 
      border: none;
      font-weight: 700;
    }
    .cart-btn:hover { background: var(--primary-dark); }
    
    .cart-count {
      position: absolute; top: -8px; right: -8px; 
      background: #ff4444; color: white; 
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; border: 2px solid var(--bg);
    }

    /* ========== HERO ========== */
    .hero {
      background: 
        linear-gradient(180deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.85) 100%),
        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
      padding: 120px 24px 80px; 
      text-align: center; 
      border-bottom: 3px solid var(--primary); 
      margin-bottom: 40px;
    }
    .hero h1 { 
      font-size: 3.5rem; margin-bottom: 12px; 
      letter-spacing: 2px; color: var(--text); 
    }
    .hero h1 span { color: var(--primary); }
    .hero p { 
      font-size: 1.1rem; color: var(--text-light); 
      max-width: 600px; margin: 0 auto; 
    }

    /* ========== SHOP CONTROLS ========== */
    .shop-controls { max-width: 1400px; margin: 0 auto 40px; padding: 0 24px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 24px; }
    .filter-btn {
      padding: 10px 24px; background: var(--surface); color: var(--text);
      border: 2px solid var(--primary); border-radius: 30px; font-weight: 600;
      text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary); border-color: var(--primary); color: #000;
    }
    .filter-btn .category-count {
      margin-left: 6px; background: var(--primary-dark); color: #000;
      padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700;
      min-width: 20px; text-align: center; display: inline-block;
    }
    
    .search-container { position: relative; max-width: 500px; margin: 0 auto; }
    .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
    #searchInput {
      width: 100%; padding: 16px 16px 16px 44px; background: var(--surface);
      border: 2px solid var(--border); border-radius: var(--radius-lg); 
      color: var(--text); font-size: 1rem;
    }
    #searchInput::placeholder { color: var(--text-light); }
    #searchInput:focus { outline: none; border-color: var(--primary); }

    /* ========== PRODUCTS GRID ========== */
    .products-grid {
      max-width: 1400px; margin: 0 auto 80px; padding: 0 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;
    }
    .product-card {
      background: var(--surface); border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid var(--border); transition: var(--transition); 
      position: relative; display: flex; flex-direction: column; height: 100%;
      box-shadow: var(--shadow);
    }
    .product-card:hover { 
      transform: translateY(-8px); border-color: var(--primary); 
    }
    .product-image { 
      width: 100%; height: 250px; object-fit: contain; 
      background: var(--bg); border-bottom: 1px solid var(--border); 
      padding: 15px; 
    }
    .product-info { padding: 24px; display: flex; flex-direction: column; flex: 1; }
    .product-category { 
      font-size: 0.75rem; color: var(--primary); text-transform: uppercase; 
      font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; 
    }
    .product-name {
      font-size: 1.25rem; font-weight: 800; color: var(--text); 
      margin-bottom: 12px; line-height: 1.3; font-family: 'Montserrat', sans-serif; 
      min-height: 3.3rem; display: -webkit-box; -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-description {
      font-size: 0.875rem; color: var(--text-light); margin-bottom: 16px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-quantity { 
      font-size: 0.8rem; font-weight: 600; color: #00c853; 
      display: block; margin-bottom: 16px; min-height: 1.2rem; 
    }
    .product-quantity.out-of-stock { color: #ff4444; }
    
    .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .product-price { 
      font-size: 1.4rem; font-weight: 900; color: var(--text); 
      font-family: 'Montserrat', sans-serif; 
    }
    .add-to-cart-btn {
      padding: 12px 20px; background: var(--primary); color: #000; 
      font-weight: 800; text-transform: uppercase; font-size: 0.9rem; 
      border-radius: var(--radius); width: auto; transition: var(--transition); 
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .add-to-cart-btn:hover:not(:disabled) { 
      background: var(--primary-dark); transform: translateY(-2px); 
    }
    .add-to-cart-btn:disabled { 
      background: var(--border); color: var(--text-light); cursor: not-allowed; 
    }

    /* ========== MODALS ========== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
    .modal {
      background: var(--surface); width: 100%; max-width: 550px;
      border-radius: var(--radius-lg); border: 1px solid var(--primary);
      max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); color: var(--text);
    }
    .modal-header { 
      padding: 24px; border-bottom: 1px solid var(--border); 
      display: flex; justify-content: space-between; align-items: center; 
    }
    .modal-title { font-size: 1.5rem; color: var(--primary); }
    .close-modal { background: none; color: var(--text-light); font-size: 1.8rem; }
    .close-modal:hover { color: var(--text); }
    .modal-body { padding: 24px; }
    .modal-footer { 
      padding: 24px; border-top: 1px solid var(--border); 
      display: flex; justify-content: space-between; align-items: center; 
      background: var(--bg); 
    }
    #detailImage { 
      width: 100%; max-height: 350px; object-fit: contain; 
      border-radius: var(--radius); background: var(--bg); margin-bottom: 20px; 
    }
    #detailName { font-size: 2rem; color: var(--text); margin-bottom: 10px; }
    #detailPrice { color: var(--primary); }
    #detailDescription { color: var(--text-light); }
    
    .cart-items { max-height: 350px; overflow-y: auto; padding-right: 10px; }
    .cart-items::-webkit-scrollbar { width: 6px; }
    .cart-items::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    .cart-item { 
      display: flex; gap: 16px; padding: 16px 0; 
      border-bottom: 1px solid var(--border); align-items: center; 
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 700; color: var(--text); font-size: 1.1rem; }
    .cart-item-price { color: var(--primary); font-weight: 600; margin-top: 4px; }
    .cart-item-quantity { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .quantity-btn { 
      width: 32px; height: 32px; background: var(--border); color: var(--text); 
      border-radius: var(--radius); font-size: 1.2rem; 
      display: flex; align-items: center; justify-content: center; 
    }
    .quantity-btn:hover { background: var(--primary); color: #000; }
    .remove-btn { 
      background: transparent; color: #ff4444; border: 1px solid #ff4444; 
      padding: 6px 12px; border-radius: var(--radius); font-size: 0.8rem; font-weight: 600; 
    }
    .remove-btn:hover { background: #ff4444; color: white; }
    .cart-total { 
      font-size: 1.5rem; font-family: 'Montserrat', sans-serif; color: var(--text); 
    }

    /* Form Elements */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-light); }
    .form-control {
      width: 100%; padding: 14px; background: var(--bg); 
      border: 1px solid var(--border); border-radius: var(--radius); 
      color: var(--text); font-size: 1rem;
    }
    .form-control::placeholder { color: var(--text-light); }
    .form-control:focus { outline: none; border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .shipping-info { 
      background: rgba(255, 204, 0, 0.1); padding: 20px; 
      border-radius: var(--radius); border: 1px dashed var(--primary); 
      margin-top: 20px; display: none; 
    }
    .shipping-info.active { display: block; }
    .btn { 
      padding: 14px 28px; border-radius: var(--radius); 
      font-weight: 700; text-transform: uppercase; letter-spacing: 1px; 
    }
    .btn-primary { background: var(--primary); color: #000; border: none; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: var(--border); color: var(--text-light); }
    .btn-outline { background: transparent; border: 1px solid #ff4444; color: #ff4444; }
    .btn-outline:hover { border-color: #ff4444; color: white; background: #ff4444; }

    /* ========== FOOTER ========== */
    .footer {
      background: var(--bg); border-top: 3px solid var(--primary);
      padding: 60px 24px 20px; margin-top: 60px; color: var(--text-light);
    }
    .footer-container {
      max-width: 1400px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px 30px;
    }
    .footer-section h3 {
      font-size: 1.2rem; color: var(--text); margin-bottom: 20px;
      letter-spacing: 1px; font-family: 'Montserrat', sans-serif;
      position: relative; padding-bottom: 10px;
    }
    .footer-section h3::after {
      content: ''; position: absolute; left: 0; bottom: 0;
      width: 40px; height: 2px; background: var(--primary);
    }
    .footer-desc { color: var(--text-light); line-height: 1.7; font-size: 0.95rem; }
    
    .contact-links { display: flex; flex-direction: column; gap: 12px; }
    .contact-link {
      display: flex; align-items: center; gap: 12px; color: var(--text-light);
      font-size: 0.95rem; transition: var(--transition); padding: 4px 0;
    }
    .contact-link i { color: var(--primary); width: 20px; font-size: 1rem; flex-shrink: 0; }
    .contact-link:hover { color: var(--primary); transform: translateX(5px); }

    .social-links { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
    .social-link {
      display: flex; align-items: center; justify-content: center;
      width: 45px; height: 45px; background: var(--surface); border-radius: 50%;
      color: var(--text); font-size: 1.2rem; transition: var(--transition);
      border: 1px solid var(--border);
    }
    .social-link:hover {
      background: var(--primary); color: #000;
      transform: translateY(-3px);
    }

    .logistics-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .logistics-list li {
      display: flex; align-items: flex-start; gap: 10px;
      color: var(--text-light); font-size: 0.95rem; line-height: 1.5;
    }
    .logistics-list i { color: var(--primary); margin-top: 3px; flex-shrink: 0; }

    .footer-bottom {
      max-width: 1400px; margin: 50px auto 0; padding-top: 20px;
      border-top: 1px solid var(--border); text-align: center;
      color: var(--text-light); font-size: 0.9rem;
    }

    /* ========== SHIPPING COVERAGE ========== */
    .shipping-coverage { background: var(--surface); padding: 80px 24px; margin-top: 40px; border-top: 1px solid var(--border); }
    .coverage-container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .coverage-info h2 { font-size: 2.5rem; margin-bottom: 16px; color: var(--text); }
    .coverage-info p { color: var(--text-light); margin-bottom: 30px; font-size: 1.1rem; }
    .wilaya-search-box { position: relative; margin-bottom: 24px; }
    .wilaya-search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--primary); }
    #wilayaSearch { width: 100%; padding: 14px 14px 14px 44px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 1rem; background: var(--bg); color: var(--text); }
    #wilayaSearch:focus { border-color: var(--primary); outline: none; }
    .table-container { max-height: 450px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    .coverage-table { width: 100%; border-collapse: collapse; text-align: left; }
    .coverage-table th { background: var(--bg); padding: 16px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--border); position: sticky; top: 0; }
    .coverage-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.95rem; color: var(--text-light); }
    .coverage-table tr:hover { background: var(--bg); }
    .price-tag { font-weight: 700; color: var(--primary); font-family: 'Montserrat', sans-serif; }
    .map-visual { position: relative; text-align: center; }
    .map-visual img { max-width: 100%; height: auto; opacity: 0.8; }
    .map-overlay-card {
      position: absolute; bottom: 20px; right: 20px; background: var(--surface);
      padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow);
      border-left: 4px solid var(--primary); text-align: left; max-width: 250px;
    }
    .map-overlay-card h4 { font-size: 0.9rem; margin-bottom: 5px; color: var(--text); }
    .map-overlay-card p { font-size: 0.8rem; color: var(--text-light); margin: 0; }

    /* Responsive */
    @media (max-width: 1024px) {
      .coverage-container { grid-template-columns: 1fr; gap: 40px; }
      .products-grid { grid-template-columns: repeat(3, 1fr); gap: 25px; }
    }
    @media (max-width: 768px) {
      .header-container { flex-direction: column; gap: 20px; padding: 15px; }
      .logo img { height: 45px; }
      .hero { padding: 80px 20px 60px; }
      .hero h1 { font-size: 2.2rem; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .modal { width: 95%; margin: 10px; }
    }
    @media (max-width: 480px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 10px; }
      .product-info { padding: 15px; }
      .product-name { font-size: 0.9rem; min-height: 2.6rem; }
      .product-description { display: none; }
      .product-footer { flex-direction: column; align-items: stretch; gap: 12px; }
      .add-to-cart-btn { width: 100%; font-size: 0.8rem; padding: 10px; }
      .product-price { font-size: 1.1rem; text-align: center; }
      .product-image { height: 180px; }
      .brand-name { font-size: 1.2rem; }
      .brand-tagline { font-size: 0.7rem; letter-spacing: 2px; }
    }
    @media (max-width: 360px) {
      .products-grid { grid-template-columns: 1fr; }
      .header-actions { flex-direction: column; width: 100%; }
      .header-btn { width: 100%; justify-content: center; }
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
